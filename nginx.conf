server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    index index.html;

    # Groq API reverse proxy (CORS workaround)
    location /api/groq/ {
        proxy_pass https://api.groq.com/openai/v1/;
        proxy_set_header Host api.groq.com;
        proxy_ssl_server_name on;
        proxy_set_header Connection '';
    }

    # SPA fallback — all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Content-Security-Policy: 'unsafe-inline' in style-src is required because Tailwind
    # (and some runtime libs) inject inline <style> tags at runtime. Replace with a nonce
    # strategy in a future pass. script-src stays strict ('self' only) — Vite's bundle is
    # same-origin and no inline/eval scripts are used.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' https://*.supabase.co https://api.openai.com https://api.groq.com https://generativelanguage.googleapis.com https://openrouter.ai wss://*.supabase.co wss://api.openai.com wss://generativelanguage.googleapis.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}
